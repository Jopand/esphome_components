text_sensor:
  - platform: modbus_controller
    modbus_controller_id: nilan_modbus_controller
    name: "Hot water anode state"
    id: nilan_hotwater_anode_state
    register_type: read
    address: 1701
    reuse_previous_range: false
    lambda: !lambda |-
      uint16_t state = (data[item->offset] << 8) | data[item->offset + 1];
      switch (state) {
        case 0: return esphome::optional<std::string>("Off");
        case 1: return esphome::optional<std::string>("OK");
        case 2: return esphome::optional<std::string>("Service");
        case 3: return esphome::optional<std::string>("Error");
        default: return esphome::optional<std::string>("Unknown (" + std::to_string(state) + ")");
      }
