sensor:
  - platform: modbus_controller
    modbus_controller_id: nilan_modbus_controller
    name: "Preheater temperature"
    id: nilan_preheat_temp_t17
    unit_of_measurement: °C
    accuracy_decimals: 1
    device_class: temperature
    value_type: S_WORD
    register_type: read
    address: 217
    filters:
      - multiply: 0.01
