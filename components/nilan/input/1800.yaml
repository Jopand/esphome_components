sensor:
  - platform: modbus_controller
    modbus_controller_id: nilan_modbus_controller
    name: "External heating setpoint"
    id: nilan_external_heating_setpoint
    unit_of_measurement: °C
    accuracy_decimals: 1
    device_class: temperature
    value_type: S_WORD
    register_type: read
    address: 1800
    filters:
      - multiply: 0.01
