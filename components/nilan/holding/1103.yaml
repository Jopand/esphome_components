text_sensor:
  - platform: modbus_controller
    modbus_controller_id: nilan_modbus_controller
    name: "Last air damper position test day"
    id: nilan_last_air_damper_test_day
    register_type: holding
    address: 1103
    lambda: |-
      uint16_t testDate = (data[item->offset] << 8) | data[item->offset + 1];

      if(!testDate) return esphome::optional<std::string>("");
      
      // Parse the date
      auto year = (testDate >> 9) + 1980;
      auto month = (testDate >> 5) & 0b00001111;
      auto day = testDate & 0b00011111;
      
      std::string dateString = std::to_string(year) + "-" +
        ((month < 10) ? "0" : "") + std::to_string(month) + "-" + 
        ((day < 10) ? "0" : "") + std::to_string(day);

      return esphome::optional<std::string>(dateString);
